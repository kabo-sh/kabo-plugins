interface:
  display_name: "Kabo Start"
  short_description: "First-run onboarding: questionnaire, one real account check-up, a 90-day plan"
  default_prompt: "Use $kabo-start to set me up."
policy:
  # Onboarding runs a real analysis that costs real time and a meaningful share of the user's own
  # quota (figures live in SKILL.md's Estimates block). It must only start on an explicit $kabo-start, or by the in-task hand-off from
  # $kabo-login / $analyze described in its SKILL.md - never because the model decided it fits.
  allow_implicit_invocation: false
