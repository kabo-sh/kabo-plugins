name: skill-retirement-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cache-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/skill-retirement.mjs tests/codex-host-guidance.mjs
